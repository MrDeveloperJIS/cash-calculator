[package]
name = "cash-calculator"
version = "1.1.0"
description = "A lightweight cash counting calculator for Bangladesh Cash"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[[bin]]
name = "cash-calculator"
path = "src/main.rs"
